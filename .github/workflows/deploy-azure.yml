name: Build e deploy - Azure App Service (Linux)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '25'          # deve ser igual ao <java.version> do pom.xml e ao runtime do App Service
  JAR_PATH: target/ponto-0.0.1-SNAPSHOT.jar

jobs:
  build:
    runs-on: ubuntu-latest

    # Banco PostgreSQL + PostGIS para os testes (o contextLoads roda as migrations do Flyway)
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: projetoponto
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/projetoponto
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # Chave apenas para o CI (Base64, >= 32 bytes). A de producao fica nas App Settings do Azure.
      API_SECURITY_TOKEN_SECRET: Y2ktc29tZW50ZS1jaGF2ZS1kZS10ZXN0ZS1kby1naXRodWItYWN0aW9ucy0xMjM0NTY=

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build e testes
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ponto-app
          path: ${{ env.JAR_PATH }}
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - name: Baixar artefato
        uses: actions/download-artifact@v4
        with:
          name: ponto-app

      - name: Deploy no Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: '*.jar'
