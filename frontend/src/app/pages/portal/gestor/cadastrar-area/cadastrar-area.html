
<div class="pagina-area">

  <h1>Cadastrar Área</h1>

  <p class="descricao">
    Cadastre um local onde os funcionários poderão registrar o ponto.
  </p>

  <div class="area-cartao">

    <h2>Dados da Área</h2>

    <form (ngSubmit)="cadastrar()">

      <div class="campo">
        <label for="nome">Nome *</label>
        <input
          type="text"
          id="nome"
          name="nome"
          [(ngModel)]="nome"
          placeholder="Ex.: Sede Centro"
        />
      </div>

      <div class="linha">
        <div class="campo">
          <label for="latitude">Latitude *</label>
          <input
            type="number"
            id="latitude"
            name="latitude"
            step="any"
            min="-90"
            max="90"
            [(ngModel)]="latitude"
            placeholder="Ex.: -23.550520"
          />
        </div>

        <div class="campo">
          <label for="longitude">Longitude *</label>
          <input
            type="number"
            id="longitude"
            name="longitude"
            step="any"
            min="-180"
            max="180"
            [(ngModel)]="longitude"
            placeholder="Ex.: -46.633308"
          />
        </div>
      </div>

      <button
        type="button"
        class="botao-secundario"
        [disabled]="obtendoLocalizacao"
        (click)="usarMinhaLocalizacao()">
        {{ obtendoLocalizacao ? 'Obtendo localização...' : 'Usar minha localização atual' }}
      </button>

      <p *ngIf="erro" class="mensagem-erro">
        {{ erro }}
      </p>

      <p *ngIf="mensagemSucesso" class="mensagem-sucesso">
        {{ mensagemSucesso }}
      </p>

      <button type="submit" class="botao-principal" [disabled]="carregando">
        {{ carregando ? 'Cadastrando...' : 'Cadastrar Área' }}
      </button>

    </form>

  </div>

</div>
