
<div class="pagina-cadastro">

  <h1>Cadastrar Funcionário</h1>

  <p class="descricao">
    Preencha os campos abaixo para cadastrar um novo funcionário no sistema.
  </p>

  <div class="area-cadastro">

    <h2>Dados do Funcionário</h2>

    <form (ngSubmit)="cadastrar()">

      <div class="campo">
        <label for="nome">Nome *</label>
        <input
          type="text"
          id="nome"
          name="nome"
          maxlength="150"
          [(ngModel)]="nome"
          placeholder="Digite o nome completo"
        />
      </div>

      <div class="linha">
        <div class="campo">
          <label for="cpf">CPF *</label>
          <input
            type="text"
            id="cpf"
            name="cpf"
            maxlength="14"
            [(ngModel)]="cpf"
            placeholder="000.000.000-00"
          />
        </div>

        <div class="campo">
          <label for="cargo">Cargo *</label>
          <input
            type="text"
            id="cargo"
            name="cargo"
            maxlength="100"
            [(ngModel)]="cargo"
            placeholder="Ex.: Analista"
          />
        </div>
      </div>

      <div class="campo">
        <label for="email">E-mail *</label>
        <input
          type="email"
          id="email"
          name="email"
          maxlength="150"
          [(ngModel)]="email"
          placeholder="Digite o e-mail"
        />
      </div>

      <div class="linha">
        <div class="campo">
          <label for="senha">Senha *</label>
          <input
            type="password"
            id="senha"
            name="senha"
            [(ngModel)]="senha"
            placeholder="Digite a senha"
          />
        </div>

        <div class="campo">
          <label for="confirmarSenha">Confirmar senha *</label>
          <input
            type="password"
            id="confirmarSenha"
            name="confirmarSenha"
            [(ngModel)]="confirmarSenha"
            placeholder="Confirme a senha"
          />
        </div>
      </div>

      <div class="linha">
        <div class="campo">
          <label for="status">Status</label>
          <select id="status" name="status" [(ngModel)]="status">
            <option value="ATIVO">Ativo</option>
            <option value="INATIVO">Inativo</option>
          </select>
        </div>

        <div class="campo">
          <label for="idGestor">ID do gestor</label>
          <input
            type="number"
            id="idGestor"
            name="idGestor"
            min="1"
            [(ngModel)]="idGestor"
            placeholder="Opcional"
          />
        </div>
      </div>

      <p *ngIf="erro" class="mensagem-erro">
        {{ erro }}
      </p>

      <p *ngIf="mensagemSucesso" class="mensagem-sucesso">
        {{ mensagemSucesso }}
      </p>

      <button type="submit" [disabled]="carregando">
        {{ carregando ? 'Cadastrando...' : 'Cadastrar Funcionário' }}
      </button>

    </form>

  </div>

</div>
