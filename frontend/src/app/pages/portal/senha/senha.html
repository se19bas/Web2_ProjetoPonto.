
<div class="pagina-senha">

  <h1>Alterar Senha</h1>

  <p class="descricao">
    Preencha os campos abaixo para alterar sua senha.
  </p>

  <div class="area-senha">

    <h2>Nova Senha</h2>

    <form (ngSubmit)="alterarSenha()">

      <div class="campo">
        <label for="senhaAtual">Senha atual</label>
        <input
          type="password"
          id="senhaAtual"
          name="senhaAtual"
          [(ngModel)]="senhaAtual"
          placeholder="Digite sua senha atual"
        />
      </div>

      <div class="campo">
        <label for="novaSenha">Nova senha</label>
        <input
          type="password"
          id="novaSenha"
          name="novaSenha"
          [(ngModel)]="novaSenha"
          placeholder="Digite sua nova senha"
        />
      </div>

      <div class="campo">
        <label for="confirmarSenha">Confirmar nova senha</label>
        <input
          type="password"
          id="confirmarSenha"
          name="confirmarSenha"
          [(ngModel)]="confirmarSenha"
          placeholder="Confirme sua nova senha"
        />
      </div>

      <p *ngIf="erro" class="mensagem-erro">
        {{ erro }}
      </p>

      <p *ngIf="mensagemSucesso" class="mensagem-sucesso">
        {{ mensagemSucesso }}
      </p>

      <button type="submit" [disabled]="carregando">
        {{ carregando ? 'Alterando...' : 'Alterar Senha' }}
      </button>

    </form>

  </div>

</div>
