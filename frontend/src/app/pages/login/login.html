
<div class="pagina-login">

  <div class="conteudo-login">

    <!-- Logo da MetaPonto

      <img
        src="/MP.png"
        alt="Logo MetaPonto"
        class="logo-metaponto"
      />

    <!-- Cartão de login -->
    <div class="cartao-login">

      <div class="area-logo">
        <img
          src="/MP.png"
          alt="Logo MetaPonto"
          class="logo-metaponto"
        />
      </div>
      <br>
      <p class="subtitulo">Acesse sua conta para continuar</p>

      <form (ngSubmit)="entrar()">

        <div class="campo">
          <label for="email">E-mail</label>

          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            placeholder="Digite seu e-mail"
            required
          />
        </div>

        <div class="campo">
          <label for="senha">Senha</label>

          <input
            type="password"
            id="senha"
            name="senha"
            [(ngModel)]="senha"
            placeholder="Digite sua senha"
            required
          />
        </div>

        <button type="submit">Entrar</button>

      </form>

    </div>

  </div>

</div>
